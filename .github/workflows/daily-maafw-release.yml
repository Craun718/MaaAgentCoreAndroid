name: Daily MaaFramework release

on:
  push:
    paths:
      - .github/workflows/daily-maafw-release.yml
  schedule:
    # Daily at 08:30 Asia/Shanghai. GitHub Actions schedules use UTC.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-maafw-release
  cancel-in-progress: false

jobs:
  check-latest-stable:
    runs-on: ubuntu-24.04
    outputs:
      maafw-version: ${{ steps.check.outputs.maafw_version }}
      maafw-published-at: ${{ steps.check.outputs.maafw_published_at }}
      release-tag: ${{ steps.check.outputs.release_tag }}
      should-build: ${{ steps.check.outputs.should_build }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Check latest stable MaaFramework release
        id: check
        run: python scripts/maafw_release.py check --kind release --python-version 3.13.15

  build-and-upload:
    needs: check-latest-stable
    if: needs.check-latest-stable.outputs.should-build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    env:
      PYTHON_VERSION_INPUT: "3.13.15"
      MAAFW_VERSION_INPUT: ${{ needs.check-latest-stable.outputs.maafw-version }}
      MAAFW_PUBLISHED_AT: ${{ needs.check-latest-stable.outputs.maafw-published-at }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host build tools
        run: python scripts/build_agent_core_release.py install-dependencies

      - name: Set up Android SDK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: bash scripts/setup-android-sdk.sh

      - name: Build and validate archives
        id: build
        env:
          BUILD_WORK_DIR: ${{ runner.temp }}/agent-core-build
        run: |
          python scripts/build_agent_core_release.py \
            --python-version "$PYTHON_VERSION_INPUT" \
            --maafw-version "$MAAFW_VERSION_INPUT" \
            --maafw-published-at "$MAAFW_PUBLISHED_AT" \
            --work-dir "$BUILD_WORK_DIR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/agent-core-build/dist/agent-core-*.tar.gz
            ${{ runner.temp }}/agent-core-build/dist/SHA256SUMS
            ${{ runner.temp }}/agent-core-build/dist/build-metadata.json
            ${{ runner.temp }}/agent-core-build/dist/build-report.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  create-release:
    needs: [check-latest-stable, build-and-upload]
    if: needs.build-and-upload.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.check-latest-stable.outputs.release-tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build-and-upload.outputs.artifact_name }}
          path: release

      - name: Create GitHub release
        run: python scripts/publish_agent_core_release.py --release-tag "$RELEASE_TAG" --release-dir release
