name: Build agent core

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Stable CPython 3.x.y version"
        required: true
        default: "3.13.15"
      maafw-version:
        description: "MaaFramework version; -beta.x is normalized to bx"
        required: true
        default: "5.12.3"

permissions:
  contents: read

concurrency:
  group: build-agent-core
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHON_VERSION_INPUT: ${{ inputs['python-version'] }}
      MAAFW_VERSION_INPUT: ${{ inputs['maafw-version'] }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl unzip \
            libssl-dev zlib1g-dev libbz2-dev libreadline-dev \
            libsqlite3-dev libffi-dev liblzma-dev

      - name: Set up Android SDK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: bash scripts/setup-android-sdk.sh

      - name: Build and validate archives
        id: build
        env:
          BUILD_WORK_DIR: ${{ runner.temp }}/agent-core-build
        run: |
          python scripts/build_agent_core.py \
            --python-version "$PYTHON_VERSION_INPUT" \
            --maafw-version "$MAAFW_VERSION_INPUT" \
            --work-dir "$BUILD_WORK_DIR"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(
              (Path(os.environ["BUILD_WORK_DIR"]) / "dist" / "build-metadata.json").read_text()
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"python_version={metadata['pythonVersion']}\n")
              handle.write(f"maafw_version={metadata['maafwVersion']}\n")
              handle.write(
                  f"artifact_name=agent-core-{metadata['pythonVersion']}"
                  f"-maafw{metadata['maafwVersion']}\n"
              )
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/agent-core-build/dist/agent-core-*.tar.gz
            ${{ runner.temp }}/agent-core-build/dist/SHA256SUMS
            ${{ runner.temp }}/agent-core-build/dist/build-metadata.json
            ${{ runner.temp }}/agent-core-build/dist/build-report.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
