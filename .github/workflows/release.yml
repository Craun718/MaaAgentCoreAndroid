name: Release agent core

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Stable CPython 3.x.y version"
        required: true
        default: "3.13.15"
      maafw-version:
        description: "MaaFramework version; -beta.x is normalized to bx"
        required: true
        default: "5.12.3"

permissions:
  contents: write

concurrency:
  group: release-agent-core
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHON_VERSION_INPUT: ${{ inputs['python-version'] }}
      MAAFW_VERSION_INPUT: ${{ inputs['maafw-version'] }}
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      BUILD_WORK_DIR: ${{ runner.temp }}/agent-core-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl unzip \
            libssl-dev zlib1g-dev libbz2-dev libreadline-dev \
            libsqlite3-dev libffi-dev liblzma-dev

      - name: Set up Android SDK
        run: bash scripts/setup-android-sdk.sh

      - name: Build and validate archives
        id: build
        run: |
          python scripts/build_agent_core.py \
            --python-version "$PYTHON_VERSION_INPUT" \
            --maafw-version "$MAAFW_VERSION_INPUT" \
            --work-dir "$BUILD_WORK_DIR"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(
              (Path(os.environ["BUILD_WORK_DIR"]) / "dist" / "build-metadata.json").read_text()
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"python_version={metadata['pythonVersion']}\n")
              handle.write(f"maafw_version={metadata['maafwVersion']}\n")
              handle.write(f"release_tag={metadata['pythonVersion']}-maafw{metadata['maafwVersion']}\n")
              handle.write(f"maafw_prerelease={str(metadata['maafwPrerelease']).lower()}\n")
          PY

      - name: Create draft release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.build.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.build.outputs.python_version }} / MaaFramework ${{ steps.build.outputs.maafw_version }}
          MAAFW_PRERELEASE: ${{ steps.build.outputs.maafw_prerelease }}
          DIST_DIR: ${{ env.BUILD_WORK_DIR }}/dist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite assets." >&2
            exit 1
          fi
          flags=(--draft --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file "$DIST_DIR/release-notes.md")
          if [[ "$MAAFW_PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          assets=(
            "$DIST_DIR"/agent-core-*.tar.gz
            "$DIST_DIR/SHA256SUMS"
            "$DIST_DIR/build-metadata.json"
          )
          gh release create "$RELEASE_TAG" "${flags[@]}" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
